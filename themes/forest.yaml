name: forest-glade

# Sources turn raw Fastly measurements into slowly changing 0..1 values.
sources:
  - name: requests
    metric: requests
    smoothing: 8
    normalise:
      min: 1
      max: 5000

  - name: bandwidth
    metric: resp_body_bytes
    smoothing: 20
    normalise:
      min: 1000
      max: 50000000

  - name: errors
    metric: errors
    smoothing: 5
    normalise:
      min: 0
      max: 50

# A theme is a collection of behaviours.
#
# probabilistic:
#   rate is the probability of an event on each one-second tick.
#
# continuous:
#   maps a normalised value to a MIDI CC.

sounds:
  - name: birds
    type: probabilistic
    channel: 0
    source: requests
    rate:
      min: 0.03
      max: 0.85
    velocity:
      min: 35
      max: 110
    duration_ms: 220
    notes: [72, 74, 77, 79, 81, 84]

  - name: river
    type: continuous
    channel: 1
    source: bandwidth
    controller: 74
    min_value: 15
    max_value: 120

  - name: woodpecker
    type: probabilistic
    channel: 2
    source: errors
    rate:
      min: 0.005
      max: 0.25
    velocity:
      min: 45
      max: 105
    duration_ms: 100
    notes: [60, 62]
