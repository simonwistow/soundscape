name: farmers-market

# The same conventional inputs as the forest theme, reinterpreted as a
# farmers market (see mappings/ for what feeds them):
#   activity -> people / conversations: shoppers come and go, chat, and
#               now and then all react at once
#   flow     -> crowd / bustle level
#   trouble  -> dropped bottles / other mishaps

# See themes/forest/theme.yaml and DEVELOPMENT.md for the full type/output
# vocabulary. sample_group paths are relative to this file.

sounds:
  # The crowd is built from two looping layers with opposing gain ramps, so
  # more activity crossfades from quiet murmur to a busy, bustling crowd
  # instead of just getting louder.
  - name: crowd-quiet
    type: continuous
    output: sample_loop
    input: activity
    sample_group: samples/crowd-quiet
    min_value: 1
    max_value: 0

  - name: crowd-busy
    type: continuous
    output: sample_loop
    input: activity
    sample_group: samples/crowd-busy
    min_value: 0
    max_value: 1

  # A crowd of shoppers who drift in and out with activity, each with their
  # own voice and place, and who now and then all react at once.
  - name: shoppers
    type: crowd
    output: sample
    input: activity
    size:
      min: 3
      max: 25
    call_rate: 0.15
    rate:
      min: 0
      max: 0.03
    velocity:
      min: 0.4
      max: 0.9
    duration_ms: 220
    sample_group: samples/chatter
    pitch_jitter:
      min: 0.85
      max: 1.2

  - name: bottles
    type: probabilistic
    output: sample
    spread: true
    input: trouble
    rate:
      min: 0.005
      max: 1.0
    velocity:
      min: 0.5
      max: 1.0
    duration_ms: 250
    sample_group: samples/bottles
    pitch_jitter:
      min: 0.9
      max: 1.1

  # A rare, quiet accordion flourish for atmosphere as the market gets
  # busier (flow), rather than tied to anything anyone would expect to
  # sound "musical" on its own.
  - name: accordion
    type: probabilistic
    output: sample
    spread: true
    input: flow
    rate:
      min: 0.01
      max: 0.15
    velocity:
      min: 0.3
      max: 0.6
    duration_ms: 600
    sample_group: samples/accordion
