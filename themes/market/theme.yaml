name: farmers-market

# The same Fastly metrics as the forest theme, reinterpreted per PLANS.md's
# farmers-market mapping:
#   requests  -> people / conversations
#   bandwidth -> crowd / bustle level
#   errors    -> dropped bottles / other mishaps
sources:
  - name: requests
    metric: requests
    smoothing: 8
    normalise:
      min: 1
      max: 5000

  - name: bandwidth
    metric: resp_body_bytes
    smoothing: 20
    normalise:
      min: 1000
      max: 50000000

  - name: errors
    metric: errors
    smoothing: 5
    normalise:
      min: 0
      max: 50

# See themes/forest/theme.yaml and DEVELOPMENT.md for the full type/output
# vocabulary. sample_group paths are relative to this file.

sounds:
  # The crowd is built from two looping layers with opposing gain ramps, so
  # more requests crossfades from quiet murmur to a busy, bustling crowd
  # instead of just getting louder.
  - name: crowd-quiet
    type: continuous
    output: sample_loop
    source: requests
    sample_group: samples/crowd-quiet
    min_value: 1
    max_value: 0

  - name: crowd-busy
    type: continuous
    output: sample_loop
    source: requests
    sample_group: samples/crowd-busy
    min_value: 0
    max_value: 1

  - name: chatter
    type: probabilistic
    output: sample
    source: requests
    rate:
      min: 0.05
      max: 3
    velocity:
      min: 0.4
      max: 0.9
    duration_ms: 220
    sample_group: samples/chatter
    pitch_jitter:
      min: 0.85
      max: 1.2

  - name: bottles
    type: probabilistic
    output: sample
    source: errors
    rate:
      min: 0.005
      max: 1.0
    velocity:
      min: 0.5
      max: 1.0
    duration_ms: 250
    sample_group: samples/bottles
    pitch_jitter:
      min: 0.9
      max: 1.1

  # A rare, quiet accordion flourish for atmosphere as the market gets
  # busier (bandwidth), rather than a Fastly metric anyone would expect to
  # sound "musical" on its own.
  - name: accordion
    type: probabilistic
    output: sample
    source: bandwidth
    rate:
      min: 0.01
      max: 0.15
    velocity:
      min: 0.3
      max: 0.6
    duration_ms: 600
    sample_group: samples/accordion
