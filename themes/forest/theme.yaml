name: forest-glade

# A theme is a collection of behaviours, each driven by an input: an
# abstract 0..1 value. Which data source feeds an input, and how it's
# scaled, is up to the mapping the theme is played with (see mappings/).
# This theme uses the conventional inputs:
#   activity -> birdsong, and flocks of starlings passing over
#   flow     -> the river, gentle to rushing, plus splashes
#   quirks   -> a woodpecker
#
# type: probabilistic
#   rate is an expected number of events per second (a Poisson process),
#   not a per-tick probability - a tick can produce zero, one, or several.
#   With spread: true, a tick's events are scattered at random across the
#   time until the next tick, rather than all sounding together as it
#   arrives.
#
# type: continuous
#   ramps a normalised value into min_value..max_value.
#
# type: flock
#   a group that arrives together, passes over and leaves: rate flocks
#   arrive per second, each with size members (bigger as its input rises)
#   that call call_rate times a second for the pass seconds it takes to go
#   by. A flock swells in, peaks overhead and fades away as it sweeps from
#   one side to the other, and each member keeps its own pitch throughout.
#
# type: crowd
#   people who come and go: size of them are there (following the input
#   over a few seconds), each with their own voice, place and distance,
#   calling call_rate times a second. An optional rate gives outbursts a
#   second, when everyone calls at once. See themes/market/theme.yaml.
#
# output: note | cc (default)
#   emits a MIDI-style event for a SoundFont or MIDI output; program (and
#   bank) picks the instrument, as on a General MIDI synth.
#
# output: sample | sample_loop
#   emits an event.Sample for the WAV sample player (internal/sampler).
#   sample_loop starts a persistent, continuously-playing layer whose gain
#   is the ramped min_value..max_value; two sample_loop sounds sharing an
#   input with opposite ramps crossfade against each other (see
#   river-gentle/river-rushing below).
#
# sample_group paths are relative to this file.

sounds:
  - name: birds
    type: probabilistic
    output: sample
    spread: true
    input: activity
    rate:
      min: 0.03
      max: 2.5
    velocity:
      min: 0.5
      max: 1.0
    duration_ms: 180
    sample_group: samples/birds
    pitch_jitter:
      min: 0.9
      max: 1.15

  # The same birds, pitched up, in flocks.
  - name: starlings
    type: flock
    output: sample
    input: activity
    rate:
      min: 0.02
      max: 0.15
    size:
      min: 3
      max: 12
    pass:
      min: 4
      max: 8
    call_rate: 2
    velocity:
      min: 0.5
      max: 0.9
    duration_ms: 180
    sample_group: samples/birds
    pitch_jitter:
      min: 1.1
      max: 1.5

  # The river is built from two looping layers with opposing gain ramps, so
  # rising flow crossfades from a gentle trickle to a rushing torrent
  # instead of just getting louder.
  - name: river-gentle
    type: continuous
    output: sample_loop
    input: flow
    sample_group: samples/river-gentle
    min_value: 1
    max_value: 0

  - name: river-rushing
    type: continuous
    output: sample_loop
    input: flow
    sample_group: samples/river-rushing
    min_value: 0
    max_value: 1

  # Occasional splashes add texture as the river gets more turbulent.
  - name: splash
    type: probabilistic
    output: sample
    spread: true
    input: flow
    rate:
      min: 0.05
      max: 3
    velocity:
      min: 0.4
      max: 0.9
    duration_ms: 150
    sample_group: samples/splash
    pitch_jitter:
      min: 0.85
      max: 1.2

  - name: woodpecker
    type: probabilistic
    output: sample
    spread: true
    input: quirks
    rate:
      min: 0.005
      max: 1.2
    velocity:
      min: 0.5
      max: 1.0
    duration_ms: 300
    sample_group: samples/woodpecker
    pitch_jitter:
      min: 0.95
      max: 1.1
