name: pentatonic

# A note-only theme: no samples, just MIDI notes, so it needs somewhere to
# send them. Play it into a synth or DAW with --midi-port or --midi-virtual,
# through a SoundFont with --soundfont, or capture it with --midi-out. Uses
# the conventional inputs (see mappings/ for what feeds them):
#   activity -> a sparse melody in C major pentatonic, busier as it rises
#   flow     -> a low bass pulse on the root and fifth
#   trouble  -> notes from outside the scale, which clash with the rest
#
# Each part has its own MIDI channel (0-based here, so 1-3 in most
# software) and a General MIDI instrument (program), which a SoundFont or GM
# synth follows. A DAW can give each channel its own instrument instead; one
# that plays every channel on one track, such as GarageBand, still
# separates them by register.
#
# See themes/forest/theme.yaml and DEVELOPMENT.md for the full type/output
# vocabulary.

sounds:
  - name: melody
    type: probabilistic
    output: note
    channel: 0
    program: 11 # Vibraphone
    input: activity
    rate:
      min: 0.1
      max: 1.5
    velocity:
      min: 45
      max: 85
    duration_ms: 700
    #      C4  D4  E4  G4  A4  C5  D5  E5  G5  A5
    notes: [60, 62, 64, 67, 69, 72, 74, 76, 79, 81]

  - name: bass
    type: probabilistic
    output: note
    spread: true
    channel: 1
    program: 32 # Acoustic Bass
    input: flow
    rate:
      min: 0.05
      max: 0.7
    velocity:
      min: 60
      max: 90
    duration_ms: 1500
    # Mostly the root, sometimes the fifth: C2 C2 C3 G2
    notes: [36, 36, 48, 43]

  - name: clash
    type: probabilistic
    output: note
    channel: 2
    program: 14 # Tubular Bells
    input: trouble
    rate:
      min: 0
      max: 0.6
    velocity:
      min: 70
      max: 100
    duration_ms: 400
    #      F#4 A#4 C#5 F#5
    notes: [66, 70, 73, 78]
